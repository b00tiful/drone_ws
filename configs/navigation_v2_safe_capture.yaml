# Demo V2 Stage 1 safe-capture curriculum configuration.
# This profile is isolated from the full-length navigation_v2.yaml task.

env:
  task_id: "AeroStrike-Navigation-V2-Safe-Capture-Direct-v0"
  episode_length_s: 14.0
  action_space: 3
  observation_space: 65
  state_space: 0
  debug_vis: false

sim:
  physics_dt_s: 0.005
  decimation: 4

scene:
  num_envs: 128
  env_spacing_m: 80.0

robot:
  prim_path: "/World/envs/env_.*/Robot"

warehouse:
  root_prim_path: "/World/envs/env_0/Warehouse"
  mesh_prim_expr: "/World/envs/env_.*/Warehouse"
  scene_variant: "long_warehouse"
  scene_config_path: "configs/scene_variants_v2_safe_capture.yaml"
  layout_seed: 101
  layout_seeds: [101, 103, 107, 109]

sensor:
  config_path: "configs/quadrotor_v2.yaml"

action:
  velocity_limit_mps: 10.0
  vertical_velocity_limit_mps: 2.0

reset:
  start_height_m: 0.8
  goal_height_m: 1.8
  min_height_m: 0.2
  max_height_m: 6.0

observation:
  goal_distance_normalizer_m: 60.0

control:
  hover_thrust_scale: 1.0

termination:
  goal_radius_m: 1.5
  collision_distance_m: 0.45
  proximity_distance_m: 4.0

diagnostics:
  clearance_margin_m: 1.0

reward:
  progress_weight: 10.0
  forward_velocity_weight: 0.8
  proximity_penalty_weight: 3.0
  proximity_speed_scale: 0.0
  collision_penalty: 25.0
  success_bonus: 40.0
  goal_entry_distance_m: 12.0
  goal_entry_progress_weight: 0.0
  goal_entry_progress_ramp_steps: 0
  instability_penalty_weight: 0.08
  action_smoothness_penalty_weight: 0.03
  vertical_velocity_penalty_weight: 0.8
  alive_penalty: 0.005
  target_speed_mps: 6.0
  overspeed_penalty_weight: 5.0
