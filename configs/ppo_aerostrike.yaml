# Initial PPO configuration scaffold for AeroStrike.
# Values are placeholders for the Week 2 Isaac Lab training task.

algorithm: PPO
library: skrl

environment:
  task_id: AeroStrike-Navigation-Direct-v0
  num_envs: 1024
  rollout_length: 24
  max_episode_steps: 500

policy:
  network:
    hidden_units: [256, 128, 64]
    activation: elu
  observation_normalization: true

optimization:
  learning_rate: 3.0e-4
  learning_rate_final: 1.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coefficient: 0.01
  clip_range: 0.2
  total_timesteps: 50000000
