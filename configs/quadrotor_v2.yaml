# Demo V2 longer-lookahead RayCaster configuration.

robot:
  env_prim_path: "{ENV_REGEX_NS}/Robot"
  smoke_prim_path: "/World/Crazyflie"
  spawn_position_m: [0.0, 0.0, 0.8]

sensor:
  prim_suffix: "body"
  mesh_prim_paths: ["/World/defaultGroundPlane"]
  ray_count: 48
  min_range_m: 0.2
  max_range_m: 40.0
  horizontal_fov_degrees: [-170.0, 170.0]
  vertical_fov_degrees: [-20.0, 20.0]
  vertical_channels: 4
  debug_vis: false
