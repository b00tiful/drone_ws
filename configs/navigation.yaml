# DirectRLEnv navigation skeleton configuration for AeroStrike.

env:
  task_id: "AeroStrike-Navigation-Direct-v0"
  episode_length_s: 10.0
  action_space: 3
  observation_space: 41
  state_space: 0
  debug_vis: false

sim:
  physics_dt_s: 0.005
  decimation: 4

scene:
  num_envs: 16
  env_spacing_m: 25.0

robot:
  prim_path: "/World/envs/env_.*/Robot"

warehouse:
  root_prim_path: "/World/envs/env_0/Warehouse"
  mesh_prim_expr: "/World/envs/env_.*/Warehouse"
  layout_seed: 7

action:
  velocity_limit_mps: 5.0

reset:
  start_height_m: 0.5
  goal_height_m: 1.5
  min_height_m: 0.1
  max_height_m: 4.0

observation:
  goal_distance_normalizer_m: 20.0

control:
  hover_thrust_scale: 1.0

termination:
  goal_radius_m: 0.75
  collision_distance_m: 0.35
  proximity_distance_m: 1.5

reward:
  progress_weight: 8.0
  forward_velocity_weight: 0.5
  proximity_penalty_weight: 2.0
  collision_penalty: 10.0
  success_bonus: 20.0
  instability_penalty_weight: 0.05
  action_smoothness_penalty_weight: 0.02
  alive_penalty: 0.01
  target_speed_mps: 3.0
